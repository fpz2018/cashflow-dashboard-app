<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/esm/index.js" type="module"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Enhanced styling for better UX */
        .transition-all {
            transition: all 0.3s ease;
        }
        
        .hover\:shadow-md:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        
        .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .shadow-xl {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        /* Custom scrollbar for better aesthetics */
        .overflow-y-auto::-webkit-scrollbar {
            width: 6px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .overflow-y-auto::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

</head>
<body class="bg-gray-50">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>

                <p class="text-gray-600">Loading AI-powered financial analytics...</p>

    <script type="text/babel">
        // Enhanced Cashflow Dashboard Component
        const { useState, useEffect, useMemo, useCallback } = React;
        
        // Import the complete enhanced dashboard
        // In a real application, this would be imported from the separate file
        // For this demo, we'll inline a simplified version showing the key features
        
        const EnhancedCashflowDemo = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isLoading, setIsLoading] = useState(false);
            const [notifications, setNotifications] = useState([]);
            
            // Demo data states
            const [demoData, setDemoData] = useState({
                totalIncome: 12450.75,
                totalExpenses: 8932.40,
                netCashflow: 3518.35,
                transactionCount: 127,
                aiCategorizedCount: 98
            });
            
            // Enhanced notification system
            const addNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type, timestamp: new Date() }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 5000);
            };
            
            // Demo functions
            const handleBunqDemo = () => {
                setIsLoading(true);
                setTimeout(() => {
                    addNotification('Bunq CSV geïmporteerd: 15 transacties automatisch gecategoriseerd door AI', 'success');
                    setDemoData(prev => ({
                        ...prev,
                        transactionCount: prev.transactionCount + 15,
                        aiCategorizedCount: prev.aiCategorizedCount + 14
                    }));
                    setIsLoading(false);
                }, 2000);
            };
            
            const handleFixedExpensesDemo = () => {
                setIsLoading(true);
                setTimeout(() => {
                    addNotification('Vaste uitgaven geïmporteerd en gegenereerd voor heel 2025', 'success');
                    setDemoData(prev => ({
                        ...prev,
                        transactionCount: prev.transactionCount + 48 // 4 expenses × 12 months

                    setIsLoading(false);

            };
            
            // SVG Icons (simplified set)

                     strokeLinejoin="round" className={className}>
                    {children}
                </svg>
            );
            
            const TrendingUp = (props) => <Icon {...props}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></Icon>;
            const Euro = (props) => <Icon {...props}><path d="M4 10h12"/><path d="M4 14h12"/><path d="M17 18c-4.42 0-8-3.58-8-8s3.58-8 8-8"/></Icon>;
            const Brain = (props) => <Icon {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></Icon>;
            const Database = (props) => <Icon {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></Icon>;

                            notification.type === 'warning' ? 'bg-yellow-500 text-white' :
                            notification.type === 'success' ? 'bg-green-500 text-white' :
                            'bg-blue-500 text-white'

                                    </div>

                                        <Brain className="h-4 w-4" />
                                        <span className="font-medium">{demoData.aiCategorizedCount} AI gecategoriseerd</span>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Navigation Tabs */}
                            <div className="border-t">
                                <nav className="-mb-px flex space-x-8">
                                    {tabs.map((tab) => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`py-4 px-1 border-b-2 font-medium text-sm flex items-center space-x-2 transition-colors ${
                                                activeTab === tab.id
                                                    ? 'border-blue-500 text-blue-600 bg-blue-50'
                                                    : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                            }`}
                                        >
                                            {tab.icon}
                                            <span>{tab.label}</span>
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </div>
                    </div>
                    
                    {/* Main Content */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Key Metrics */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-white p-6 rounded-lg shadow border">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-sm font-medium text-gray-600">Totale Inkomsten</p>
                                                <p className="text-2xl font-bold text-green-600">{formatCurrencyNL(demoData.totalIncome)}</p>
                                            </div>
                                            <TrendingUp className="h-8 w-8 text-green-600" />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-6 rounded-lg shadow border">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-sm font-medium text-gray-600">Totale Uitgaven</p>
                                                <p className="text-2xl font-bold text-red-600">{formatCurrencyNL(demoData.totalExpenses)}</p>
                                            </div>
                                            <Euro className="h-8 w-8 text-red-600" />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-6 rounded-lg shadow border">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-sm font-medium text-gray-600">Netto Cashflow</p>
                                                <p className="text-2xl font-bold text-green-600">{formatCurrencyNL(demoData.netCashflow)}</p>
                                            </div>
                                            <TrendingUp className="h-8 w-8 text-blue-600" />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-6 rounded-lg shadow border">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="text-sm font-medium text-gray-600">AI Accuracy</p>
                                                <p className="text-2xl font-bold text-purple-600">95%</p>
                                            </div>
                                            <Brain className="h-8 w-8 text-purple-600" />
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Implementation Status */}
                                <div className="bg-gradient-to-r from-green-50 to-blue-50 border border-green-200 rounded-lg p-8">
                                    <h3 className="font-bold text-green-800 mb-4 text-xl flex items-center">
                                        <CheckCircle className="h-6 w-6 mr-2" />
                                        ✅ VOLLEDIG GEÏMPLEMENTEERD - ALLE VEREISTEN VOLDAAN
                                    </h3>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div>
                                            <h4 className="font-semibold text-green-700 mb-3">Data Processors (Exacte Kolomstructuren):</h4>
                                            <ul className="space-y-2 text-sm text-green-600">
                                                <li>✓ <strong>Declaraties:</strong> factuur, datum, verzekeraar, bedrag</li>
                                                <li>✓ <strong>Facturen:</strong> factuur, datum, debiteur, bedrag</li>
                                                <li>✓ <strong>Credit Facturen:</strong> factuur, datum, debiteur, bedrag (min)</li>
                                                <li>✓ <strong>Credit Declaraties:</strong> factuur, datum, verzekeraar, factuur_origineel, bedrag</li>
                                                <li>✓ <strong>Correctiefacturen:</strong> factuur, datum, verzekeraar, factuur_origineel, bedrag</li>
                                                <li>✓ <strong>Vaste Uitgaven:</strong> crediteur, bedrag, dag</li>
                                                <li>✓ <strong>Bunq CSV:</strong> datum;debiteur;omschrijving;bedrag</li>
                                            </ul>
                                        </div>
                                        
                                        <div>
                                            <h4 className="font-semibold text-green-700 mb-3">Advanced Features:</h4>
